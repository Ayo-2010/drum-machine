<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drum Machine</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<main class="studio">
  <header>
    <div>
      <h1>Drum Machine</h1>
      <p>Tap a pad or press 1 to 8.</p>
    </div>
    <span class="badge">8 pads</span>
  </header>

  <div class="pads" id="pads"></div>

  <div class="bar">
    <label for="volume">Volume</label>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    <output id="volumeOut">80%</output>
  </div>

  <p class="hint">Every sound is generated in the browser with the Web Audio API.</p>
</main>
<script src="script.js"></script>
</body>
</html>
